---
- name: Install Java (Jenkins requirement)
  apt:
    name:
      - fontconfig
      - openjdk-21-jre
    state: present
    update_cache: true

- name: Add Jenkins GPG key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /usr/share/keyrings/jenkins-keyring.asc
    mode: "0644"
    force: true

- name: Add Jenkins apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: true

- name: Ensure Jenkins is running and enabled
  systemd:
    name: jenkins
    state: started
    enabled: true

- name: Re-add jenkins user to docker group (created by the jenkins package)
  user:
    name: jenkins
    groups: docker
    append: true
  notify: Restart Jenkins

- name: Wait for Jenkins to report initial admin password
  wait_for:
    path: /var/lib/jenkins/secrets/initialAdminPassword
    state: present
    timeout: 180

- name: Read Jenkins initial admin password
  slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_initial_password_raw

- name: Download the Jenkins plugin installation manager tool
  get_url:
    url: https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.15.0/jenkins-plugin-manager-2.15.0.jar
    dest: /opt/jenkins-plugin-manager.jar
    mode: "0644"

- name: Install Jenkins plugins
  command: >
    java -jar /opt/jenkins-plugin-manager.jar
    --war /usr/share/java/jenkins.war
    --plugin-download-directory /var/lib/jenkins/plugins
    --plugins {{ jenkins_plugins | join(' ') }}
  register: plugin_install
  changed_when: "'Skipping' not in plugin_install.stdout"
  notify: Restart Jenkins

- name: Fix plugin directory ownership (installer above runs as root)
  file:
    path: /var/lib/jenkins/plugins
    owner: jenkins
    group: jenkins
    recurse: true
  notify: Restart Jenkins

- name: Show Jenkins initial admin password (finish setup wizard manually)
  debug:
    msg: "Jenkins initial admin password: {{ jenkins_initial_password_raw.content | b64decode | trim }}"
