server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # In-cluster service DNS (same namespace as the frontend pod) — these
    # names only resolve inside the EKS cluster, which is exactly the point:
    # the browser never talks to them directly, only through this proxy.

    location /api/streaming/ {
        proxy_pass http://streamingapp-streamingservice:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/admin/ {
        proxy_pass http://streamingapp-adminservice:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/chat/ {
        proxy_pass http://streamingapp-chatservice:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        proxy_pass http://streamingapp-chatservice:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # authService owns the plain /api/* namespace (e.g. /api/login) — must
    # stay last so the more specific locations above win on their prefixes.
    location /api/ {
        proxy_pass http://streamingapp-authservice:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://streamingapp-authservice:3001;
    }

    location / {
        try_files $uri /index.html;
    }
}
