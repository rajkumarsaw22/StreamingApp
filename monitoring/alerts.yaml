# PrometheusRule picked up automatically by kube-prometheus-stack's Prometheus
# (ruleSelector: {} in kube-prometheus-stack-values.yaml matches any namespace).
#
#   kubectl apply -f monitoring/alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: streamingapp-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: streamingapp.rules
      rules:
        - alert: StreamingAppPodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="streamingapp"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace streamingapp) has restarted more than 3 times in the last 15 minutes."

        - alert: StreamingAppDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="streamingapp"}
              != kube_deployment_status_replicas_available{namespace="streamingapp"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has mismatched replicas"
            description: "Deployment {{ $labels.deployment }} in namespace streamingapp does not have the desired number of available replicas for over 10 minutes."

        - alert: StreamingAppPodHighMemory
          expr: |
            container_memory_working_set_bytes{namespace="streamingapp", container!=""}
              / container_spec_memory_limit_bytes{namespace="streamingapp", container!=""} > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is near its memory limit"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using over 90% of its memory limit for 10+ minutes."

        - alert: StreamingAppPodHighCPU
          expr: |
            rate(container_cpu_usage_seconds_total{namespace="streamingapp", container!=""}[5m])
              / kube_pod_container_resource_limits{namespace="streamingapp", resource="cpu"} > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is near its CPU limit"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has used over 90% of its CPU limit for 10+ minutes."

        - alert: StreamingAppDeploymentDown
          expr: |
            kube_deployment_status_replicas_available{namespace="streamingapp"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.deployment }} has zero available replicas"
            description: "Deployment {{ $labels.deployment }} in namespace streamingapp has had 0 available replicas for over 2 minutes — the service is effectively down."
